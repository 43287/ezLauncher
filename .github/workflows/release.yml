name: Release

on:
  push:
    tags:
      - 'v*'          # 仅 v 开头的 tag 触发，如 v0.1.8

permissions:
  contents: write     # 允许 Action 创建 Release、上传产物

jobs:
  release:
    runs-on: windows-latest    # Windows native 专属，单平台
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ezLauncher ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
